<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font mono mặc định: JetBrainsMono Nerd Font (đồng bộ với foot, waybar, rofi, mako) -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>mono</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
