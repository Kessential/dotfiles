# Appearance — Catppuccin Mocha
# base #1e1e2e  surface0 #313244  surface1 #45475a  text #cdd6f4
# subtext0 #a6adc8  lavender #b4befe  red #f38ba8

font pango:Noto Sans Mono 10.5

gaps inner 6
gaps outer 2
smart_gaps on

default_border normal 2
default_floating_border normal 2
hide_edge_borders smart

# class                 border   background text     indicator child_border
client.focused          #b4befe  #1e1e2e   #cdd6f4  #b4befe   #b4befe
client.focused_inactive #45475a  #1e1e2e   #a6adc8  #45475a   #45475a
client.unfocused        #313244  #1e1e2e   #a6adc8  #313244   #313244
client.urgent           #f38ba8  #1e1e2e   #cdd6f4  #f38ba8   #f38ba8
client.placeholder      #313244  #1e1e2e   #cdd6f4  #313244   #313244
client.background       #1e1e2e
